# =============================================================================
#  8.178：**Ember の Linux 版をここで作る**（Phase 219／本人の要望）。
#
#  手元にLinuxが無いので（WSLもDockerも入っていない）、**組んで確かめる場所を
#  GitHub側に置きました。** 押した時点で本当にビルドが通るかが分かります。
#
#  ─────────────────────────────────────────────────────────────────────────
#  走らせ方
#  ─────────────────────────────────────────────────────────────────────────
#
#    - GitHubの Actions タブ → "Ember (Linux)" → Run workflow
#    - タグ（v1.0.0 など）を押したときも自動で走ります
#
#  できるもの（Artifacts からダウンロード）：
#
#    Ember-<version>-Linux-x86_64.tar.gz    解凍して ./Ember で起動
#    Ember-<version>-x86_64.AppImage        1ファイル。chmod +x して起動
#
#  ─────────────────────────────────────────────────────────────────────────
#  Windows版と違うところ
#  ─────────────────────────────────────────────────────────────────────────
#
#    - **ASIOはもともと入っていません**（Ember共通。8.174）。
#      Linuxでは ALSA / JACK になります
#    - **MP3の書き出しができません。** Windowsの Media Foundation を使っているため
#      （`Mp3Writer.cpp`）。WAVとFLACは今までどおり
#    - プラグインは `~/.vst3` `/usr/local/lib/vst3` `/usr/lib/vst3` を見ます（8.178）
# =============================================================================

name: Ember (Linux)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# 8.193：**Releasesへ貼るには書き込みの許可が要ります**（Phase 230）。
# 既定は読み取りだけなので、無いと`gh release create`が403で落ちます。
# **`contents: write`だけ**にしてあります——要らない許可は渡しません
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # JUCEがLinuxで要るもの。**ここを削らないこと**——
      # 足りないと、CMakeの構成ではなく**コンパイルの途中**で落ちるので原因が分かりにくい
      #
      # 8.180：`libxi-dev`を足しました（Phase 220／3回目の実行）。無いと
      # `juce_gui_basics.h:393: fatal error: X11/extensions/XInput2.h`で止まります。
      # JUCEの公式の一覧には入っていませんが、**GUIモジュールが直に読みに行きます**
      - name: Install JUCE's Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libasound2-dev libjack-jackd2-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libxi-dev \
            libglu1-mesa-dev mesa-common-dev \
            libcurl4-openssl-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMANTA_BRAND=ember

      # 8.179：**出力を残して、失敗したらエラー行だけ抜き出す**（Phase 220）。
      #
      # 最初の実行では、ログ901行のうち800行以上が警告で埋まり、
      # **本当のエラーが見つけられませんでした**（GitHubのログ表示は
      # 長いものを遅延読み込みするので、検索も全体に届きません）。
      #
      # `tee`で控えを取り、落ちたときに`error:`の行と末尾だけを別ステップに出します。
      # `-k 0` は ninja の「**止まらずに最後まで試す**」。
      # 既定だと最初の1つで止まるので、**移植のあいだは1往復に1個しか直せません**
      # （1回15分。エラーが5個あれば5往復）。全部出させて、まとめて直します。
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build -- -k 0 2>&1 | tee build.log

      - name: Show what failed
        if: failure()
        shell: bash
        run: |
          echo "=================== error lines ==================="
          grep -nE "error:|FAILED:|Error [0-9]" build.log | head -60 || echo "(none found)"
          echo ""
          echo "=================== last 80 lines ================="
          tail -n 80 build.log

      - name: Read the version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -oP 'project\s*\(\s*PersonalDAW\s+VERSION\s+\K[0-9.]+' CMakeLists.txt)
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

          # 8.193：**タグと`CMakeLists.txt`の版が合っているか確かめます**（Phase 230）。
          #
          # 合っていないまま配ると、**中身が0.1.0なのに`v0.2.0`という名前の
          # リリースが出来ます**。あとから直すには、公開したものを引っ込めることに
          # なります——**貼る前に止めるほうがずっと安い。**
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"

            if [ "$TAG" != "$VERSION" ]; then
              echo "::error::Tag v$TAG does not match project(PersonalDAW VERSION $VERSION) in CMakeLists.txt."
              echo "Bump the version in CMakeLists.txt, or tag v$VERSION instead."
              exit 1
            fi

            echo "tag and CMakeLists agree on $VERSION"
          fi

      # 8.181：**出来上がった実行ファイルを探して、場所を覚えておく**（Phase 220／4回目）。
      #
      # `build/PersonalDAW_artefacts/Ember` と決め打ちしていたら、
      # `cp: cannot stat ... No such file or directory` で止まりました。
      # JUCEが実際にどこへ置くかは**生成器と構成の組み合わせで変わります**
      # （Windowsは `.../Release/Manta Studio.exe`、Ninjaはまた別）。
      #
      # 決め打ちをやめて、探します。**中身が変わっても壊れません**
      - name: Find the executable
        shell: bash
        run: |
          echo "--- what JUCE actually produced ---"
          find build -path '*PersonalDAW_artefacts*' -maxdepth 4 | head -40
          EMBER=$(find build -name Ember -type f -perm -u+x | head -1)
          if [ -z "$EMBER" ]; then
            echo "Could not find the Ember executable anywhere under build/"
            exit 1
          fi
          echo "found: $EMBER"
          echo "EMBER=$EMBER" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------------
      # tar.gz。**解凍して起動できる**のがここでの目標
      - name: Stage
        run: |
          NAME="Ember-${{ steps.version.outputs.value }}-Linux-x86_64"
          mkdir -p "stage/$NAME"
          cp "$EMBER" "stage/$NAME/"
          cp Packaging/Ember/README.md Packaging/Ember/CHANGELOG.md Packaging/Ember/LICENSE.txt "stage/$NAME/"
          tar -C stage -czf "$NAME.tar.gz" "$NAME"
          echo "NAME=$NAME" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------------
      # AppImage。**配るならこちら**——ディストリを問わず1ファイルで動きます
      - name: Build the AppImage
        run: |
          VERSION="${{ steps.version.outputs.value }}"

          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp "$EMBER" AppDir/usr/bin/

          # アイコンはリポジトリのものをそのまま（1000x1000。AppImageは縮めてくれます）
          cp Resources/Icons/ember_icon.png AppDir/usr/share/icons/hicolor/256x256/apps/ember.png
          cp Resources/Icons/ember_icon.png AppDir/ember.png

          cat > AppDir/ember.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Ember
          Comment=Digital audio workstation
          Exec=Ember
          Icon=ember
          Categories=AudioVideo;Audio;AudioVideoEditing;
          Terminal=false
          DESKTOP

          cp AppDir/ember.desktop AppDir/usr/share/applications/

          cat > AppDir/AppRun <<'APPRUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/Ember" "$@"
          APPRUN
          chmod +x AppDir/AppRun

          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          # ランナーにFUSEが無いので、展開して使う
          ./appimagetool-x86_64.AppImage --appimage-extract > /dev/null
          ARCH=x86_64 ./squashfs-root/AppRun AppDir "Ember-$VERSION-x86_64.AppImage"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ember-linux
          # 8.183：**`Ember-`で始まるものだけ**（Phase 222／本人の`ls`で発覚）。
          # `*.AppImage`だと、AppImageを作る道具（`appimagetool`）まで
          # 一緒に配ってしまっていました
          path: |
            Ember-*.tar.gz
            Ember-*.AppImage

      # ---------------------------------------------------------------------
      # 8.193：**タグを押したら、Releasesの下書きを作る**（Phase 230／本人の要望）。
      #
      # ─────────────────────────────────────────────────────────────────────
      #  なぜ Releases が要るか
      # ─────────────────────────────────────────────────────────────────────
      #
      #  **上の Artifacts は、GitHubにログインしないとダウンロードできません。**
      #  リポジトリを公開にしても、そこは変わりません。
      #  つまり**他の人に配るのには使えません。**
      #
      #  Releases に貼ったファイルは、**ログイン無しで誰でも取れます。**
      #
      # ─────────────────────────────────────────────────────────────────────
      #  なぜ「下書き」で止めるか
      # ─────────────────────────────────────────────────────────────────────
      #
      #  **Windows版はここでは作っていません。** ビルドしているのは本人のPCで、
      #  動作確認もそこでやっています（8.191）。CIにWindowsを足すこともできますが、
      #  **確かめていないものを自動で公開するほうが危ない。**
      #
      #  そこで、**Linux版を貼った下書きまで**をここで作ります。
      #  本人が Windows の zip と Setup.exe を足して、**中身を見てから Publish**。
      #
      #  **公開の最後の一押しは人が持つ**——これはこの先も変えないほうがよいと思います。
      #
      #  `gh`はランナーに入っているので、他人のアクションを増やしていません。
      - name: Draft a release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.value }}"

          # **すでに下書きがあれば、貼り直すだけ**（作り直しはしない）。
          # 同じタグで2回押したときに「もう有る」で落ちないように
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists - uploading over it"
            gh release upload "$GITHUB_REF_NAME" Ember-*.tar.gz Ember-*.AppImage --clobber
            exit 0
          fi

          # 本文は`Packaging/Ember/CHANGELOG.md`から取りません——
          # **その版のぶんだけを切り出す決まりが要る**ので、いまは定型文にしてあります。
          # 下書きなので、本人が Publish の前に書き足せます
          cat > notes.md <<'NOTES'
          ## Downloads

          | | |
          |---|---|
          | **Windows — installer** | `Ember-VERSION-Windows-x64-Setup.exe` |
          | **Windows — portable** | `Ember-VERSION-Windows-x64.zip` |
          | **Linux — AppImage** | `Ember-VERSION-x86_64.AppImage` — `chmod +x`, then run |
          | **Linux — archive** | `Ember-VERSION-Linux-x86_64.tar.gz` |

          Windows 10/11 64-bit, or a 64-bit Linux with glibc 2.39 or newer
          (Ubuntu 24.04, Linux Mint 22 and later).

          Neither download is code-signed, so Windows will say the publisher is
          unknown. See the README for what to do about that.

          Ember is free software under the GNU Affero General Public License,
          version 3 or later. The source is this repository.
          NOTES

          sed -i "s/VERSION/$VERSION/g" notes.md

          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "Ember $VERSION" \
            --notes-file notes.md \
            Ember-*.tar.gz Ember-*.AppImage

          echo "### Draft release created" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Add the Windows zip and Setup.exe, then press Publish:" >> "$GITHUB_STEP_SUMMARY"
          echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases" >> "$GITHUB_STEP_SUMMARY"
